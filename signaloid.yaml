MinimumCore:
    Microarchitecture: Athens
    MemorySize: 256000
    Precision: 32

TraceVariables:
    - File: "main.c"

      LineNumber: 51

      Expression: "outputVariables[0:0]"

BenchmarkingVariables:
    - VariableName: outputVariables[0]
      VariableDescription: Calibrated FLIR Ax5 sensor output in Kelvin.
      OutputObject: Distribution
      CommandLineArguments: -S 0

BenchmarkingAllOutputs:
    - CommandLineArguments: -S 1
